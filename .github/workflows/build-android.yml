name: Build Android (.aab / .apk)

# Run it manually from the GitHub "Actions" tab → "Build Android (.aab / .apk)"
# → "Run workflow". Builds with `eas build --local` on GitHub's free Ubuntu
# runner (no EAS build credits used) and publishes the result as a download.
#
# Pick a profile when you run it:
#   • production → signed .aab for the Play Store (default)
#   • preview    → installable .apk you can sideload straight onto a rep's phone
#                  (much faster to iterate than uploading an .aab to Play)
#
# Needs the EXPO_TOKEN repository secret (Settings → Secrets and variables →
# Actions). The app talks to the API set in eas.json for the chosen profile.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        type: choice
        options:
          - production
          - preview
        default: production

jobs:
  build:
    # Pinned, not ubuntu-latest: from 19 Oct 2026 that label moved to Ubuntu 26.
    # 24.04 is the image these Expo builds were proven on, with an Android SDK
    # preinstalled at $ANDROID_HOME; move up deliberately, not by surprise.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Needed so the workflow can publish the build as a GitHub Release asset.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space (remove preinstalled tools we don't need)
        run: |
          echo "Disk before:"; df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /usr/share/swift \
            /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/PyPy || true
          sudo docker image prune -a -f || true
          echo "Disk after:"; df -h /

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Raise Gradle memory
        # Written to the GLOBAL Gradle home so it survives `expo prebuild`
        # regenerating android/gradle.properties during `eas build --local`.
        run: |
          mkdir -p ~/.gradle
          echo 'org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8' >> ~/.gradle/gradle.properties

      - name: Cache Gradle (reuse compiled native libs across runs)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
            android/app/.cxx
          key: gradle-${{ runner.os }}-${{ hashFiles('**/package-lock.json', 'app.json', 'eas.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install eas-cli
        run: npm install -g eas-cli

      - name: Install dependencies
        run: npm ci

      # The runner image already ships an Android SDK with a working sdkmanager.
      # android-actions/setup-android@v3 rejects that one as the "wrong version",
      # downloads the newest command-line tools and then dies accepting the
      # licenses — which broke this step (here and in the inventory app) in late
      # Oct 2026. Using the preinstalled tools takes the download out of the build.
      - name: Use the runner's Android SDK (licenses + required packages)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKM" --version
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKM" --licenses > /dev/null
          "$SDKM" "platforms;android-36" "build-tools;34.0.0" "ndk;27.3.13750724" "cmake;3.22.1"

      - name: Pick output extension for the profile
        id: out
        run: |
          if [ "${{ inputs.profile }}" = "preview" ]; then
            echo "ext=apk" >> "$GITHUB_OUTPUT"
          else
            echo "ext=aab" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (local — free, no EAS credits)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build --local \
            --platform android \
            --profile "${{ inputs.profile }}" \
            --non-interactive \
            --output "${{ github.workspace }}/app-release.${{ steps.out.outputs.ext }}"

      # The manifest merger only runs during the build, so the shipped artifact
      # is the one place the final permission list can be checked — both ways:
      #
      #   blocked  — `blockedPermissions` in app.json only marks them for removal
      #              in the source; a stray RECORD_AUDIO or location permission on
      #              a call-tracking app means extra Play review questions.
      #   required — without the call-tracker module's permissions the app installs
      #              and opens fine, then silently tracks no calls. Worth a failed
      #              build over a rep finding out a week later.
      - name: Verify the shipped permissions
        run: |
          BT=1.17.2
          curl -sL -o /tmp/bundletool.jar \
            "https://github.com/google/bundletool/releases/download/$BT/bundletool-all-$BT.jar"
          ART="app-release.${{ steps.out.outputs.ext }}"
          if [ "${{ steps.out.outputs.ext }}" = "aab" ]; then
            java -jar /tmp/bundletool.jar dump manifest --bundle="$ART" > /tmp/manifest.xml
          else
            $ANDROID_HOME/build-tools/34.0.0/aapt2 dump xmltree "$ART" \
              --file AndroidManifest.xml > /tmp/manifest.xml
          fi

          echo "--- permissions in the shipped manifest ---"
          grep -oE 'android\.permission\.[A-Z_]+' /tmp/manifest.xml | sort -u

          BLOCKED="RECORD_AUDIO SYSTEM_ALERT_WINDOW ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION"
          REQUIRED="READ_CALL_LOG READ_PHONE_STATE READ_PHONE_NUMBERS READ_MEDIA_AUDIO POST_NOTIFICATIONS"
          FOUND=""; MISSING=""
          for p in $BLOCKED; do
            grep -qE "android\.permission\.$p\b" /tmp/manifest.xml && FOUND="$FOUND $p"
          done
          for p in $REQUIRED; do
            grep -qE "android\.permission\.$p\b" /tmp/manifest.xml || MISSING="$MISSING $p"
          done
          if [ -n "$FOUND" ]; then echo "::error::Blocked permission(s) still present:$FOUND"; fi
          if [ -n "$MISSING" ]; then echo "::error::Call tracking permission(s) missing:$MISSING"; fi
          [ -z "$FOUND$MISSING" ] || exit 1
          echo "OK — no blocked permissions, and every call-tracking permission is in the build."

      # Publish to a GitHub RELEASE, not an artifact. Release assets do NOT count
      # against the 500 MB Actions artifact quota (they allow up to 2 GB). Each
      # build gets its own pre-release on the repo's "Releases" page.
      - name: Publish build to a GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="android-${{ inputs.profile }}-${{ github.run_number }}"
          gh release create "$TAG" \
            "app-release.${{ steps.out.outputs.ext }}" \
            --title "Android ${{ inputs.profile }} build #${{ github.run_number }}" \
            --notes "Automated \`eas build --local\` output. Download the .${{ steps.out.outputs.ext }} file below." \
            --prerelease
